<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faculty Computer Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
:root{
  --ground:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f5; --ink:#15171a; --muted:#5f6670; --line:#dde2e8;
  --accent:#1459b8; --accent-ink:#ffffff; --accent-soft:#e3edfb;
  --ok:#187a3c; --ok-soft:#e2f4e8; --warn:#9a4d00; --warn-soft:#fdf0de; --bad:#b3261e; --bad-soft:#fbe7e5;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
  --display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Anuphan",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0f1113; --surface:#181b1f; --surface-2:#22262b; --ink:#eef0f3; --muted:#a2a9b3; --line:#2e333a;
  --accent:#5b9bf0; --accent-ink:#0b1320; --accent-soft:#1a2a42;
  --ok:#5cc983; --ok-soft:#13301e; --warn:#f0a955; --warn-soft:#3a2710; --bad:#f08b83; --bad-soft:#3b1714;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f1113; --surface:#181b1f; --surface-2:#22262b; --ink:#eef0f3; --muted:#a2a9b3; --line:#2e333a;
  --accent:#5b9bf0; --accent-ink:#0b1320; --accent-soft:#1a2a42;
  --ok:#5cc983; --ok-soft:#13301e; --warn:#f0a955; --warn-soft:#3a2710; --bad:#f08b83; --bad-soft:#3b1714;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:12px;font-weight:700}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer}
.admin-link{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.admin-link[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:40px 120px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.th{color:var(--muted);font-size:.9em;font-weight:500}

/* Chooser */
.hero{text-align:center;display:grid;gap:10px;margin-bottom:36px}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:700}
.hero p{color:var(--muted);font-size:17px}
.allow{display:inline-flex;gap:8px;align-items:center;margin:6px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.allow b{font-family:var(--display)}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px 24px;text-align:center;cursor:pointer;display:grid;gap:14px;justify-items:center;box-shadow:var(--shadow);transition:transform .2s ease,border-color .2s ease}
.pick:hover{transform:translateY(-3px);border-color:var(--accent)}
.pick h2{font-size:34px;font-weight:700}
.pick .sub{color:var(--muted)}
.pick .range{font-size:14px}
.pick .cta{color:var(--accent);font-weight:600}
.pick .photo{width:min(320px,100%);height:210px;object-fit:contain}
.saved{background:var(--accent-soft);border-radius:16px;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
.saved p{flex:1;min-width:220px}

/* Lineup */
.lineup-head{display:grid;gap:8px;margin-bottom:28px}
.lineup-head h1{font-size:clamp(30px,5vw,44px)}
.lineup-head p{color:var(--muted);max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card .photo{width:100%;height:170px;object-fit:contain;align-self:center}
.card h3{font-size:22px}
.card .chip{color:var(--muted);font-size:13px}
.hl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-block:1px solid var(--line);padding-block:12px}
.hl div{display:grid;text-align:center}
.hl b{font-family:var(--display);font-size:17px}
.hl span{font-size:12px;color:var(--muted)}
.price{font-family:var(--display);font-size:20px;font-weight:600}
.price small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);display:block}
.card .spacer{flex:1}
.cost{display:grid;gap:2px;border-radius:12px;padding:10px 14px}
.cost b{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.2}
.cost small{font-size:12px;opacity:.85}
.cost.ok{background:var(--ok-soft);color:var(--ok)}
.cost.warn{background:var(--warn-soft);color:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;width:fit-content}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{appearance:none;border:0;border-radius:999px;padding:10px 20px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 14px;font-size:13px}
.quote-meta{font-size:12px;color:var(--muted)}
.quote-meta.expired{color:var(--bad)}

/* Configure */
.config{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:820px){.config{grid-template-columns:1fr;gap:24px}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:grid;gap:18px}
@media (max-width:820px){.stage{position:static}}
.stage-art{background:var(--surface-2);border-radius:24px;padding:36px 24px;display:grid;place-items:center}
.stage-art .photo{width:min(460px,100%);height:clamp(220px,34vw,340px);object-fit:contain}
.specs{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.specs h3{font-size:15px;margin-bottom:8px}
.specs ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.panel{display:grid;gap:26px}
.panel h1{font-size:clamp(28px,4.5vw,40px)}
.section{display:grid;gap:12px}
.section > h2{font-size:19px}
.section > h2 .th{font-size:14px;margin-left:6px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt .t{flex:1;display:grid;gap:2px}
.opt .t b{font-weight:600}
.opt .t span{font-size:13px;color:var(--muted)}
.opt .p{font-weight:600;white-space:nowrap}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.sw{display:grid;justify-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.15);box-shadow:0 0 0 3px var(--ground),0 0 0 4px transparent}
.sw:has(input:checked) i{box-shadow:0 0 0 3px var(--ground),0 0 0 5px var(--accent)}
.sw:has(input:checked){color:var(--ink)}
.sw:has(input:focus-visible) i{outline:2px solid var(--accent);outline-offset:6px}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;gap:12px}
.row.total{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-family:var(--display);font-size:18px;font-weight:600}
.row.topup{font-family:var(--display);font-size:18px;font-weight:600;color:var(--warn)}
.row.ok{color:var(--ok);font-weight:600}
.row span:first-child{color:var(--muted)}
.row.total span:first-child,.row.topup span:first-child{color:inherit}

.topup-box{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:18px;padding:18px 20px;display:grid;gap:12px}
.topup-box h2{font-size:18px;color:var(--warn)}
.topup-box p{font-size:14px}
.field{display:grid;gap:5px}
.field label{font-size:13.5px;font-weight:500}
.field .hint{font-size:12.5px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.req{color:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:5px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13.5px}
.notice{border-radius:12px;padding:10px 14px;font-size:13.5px;background:var(--surface-2);color:var(--muted)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar-in .what{flex:1;min-width:160px;font-size:13px;color:var(--muted)}
.bar-in .what b{display:block;font-family:var(--display);color:var(--ink);font-size:17px}

/* Done */
.done{max-width:640px;margin:0 auto;display:grid;gap:20px;text-align:center}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto}
.done h1{font-size:clamp(28px,5vw,40px)}
.receipt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:8px}
.receipt .ref{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Admin */
.admin-head{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:20px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:140px}
.stat b{display:block;font-family:var(--display);font-size:22px}
.stat span{font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:900px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
#csvOut{width:100%;min-height:120px;margin-top:12px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
.hint{font-size:12.5px;color:var(--muted)}
.saved{flex-direction:column;align-items:stretch;gap:8px}
.saved-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.saved-row p{flex:1;min-width:220px}

/* Tablet promo on the home page */
.pending-note{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--warn)!important;font-weight:500}
.pending-note .dot{width:8px;height:8px;border-radius:50%;border:2px solid currentColor}
.estimate-banner{border:1.5px dashed var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 16px;font-size:13.5px;margin-bottom:22px}
.stage .estimate-banner{margin-bottom:0}
.estimate-banner b{color:var(--warn)}
.estimate-banner.quoted{border-style:solid;border-color:var(--line);background:var(--surface-2)}
.estimate-banner.quoted b{color:var(--ink)}
.blurb{font-size:14px;color:var(--muted)}

/* Tablet option tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tiles.two{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);cursor:pointer;position:relative}
.tile input{position:absolute;opacity:0;pointer-events:none}
.tile:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tile:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.tile.disabled{cursor:not-allowed;opacity:.55;border-style:dashed}
.tt{display:grid;gap:1px}
.tt b{font-weight:600}
.tt span{font-size:12.5px;color:var(--muted)}
.est{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.est.ok{background:var(--ok-soft);color:var(--ok)}
.est.warn{background:var(--warn-soft);color:var(--warn)}

.actions.start{justify-content:flex-start}
@media (max-width:640px){.tp-copy .actions.start{justify-content:center}}
.answered{font-size:13.5px;color:var(--ok)!important;font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font:inherit}
.narrow{max-width:620px;margin:0 auto;display:grid;gap:14px}
.narrow h1{font-size:clamp(28px,5vw,38px)}
.next-q{background:var(--accent-soft);border-radius:18px;padding:20px;display:grid;gap:10px;text-align:center}
.next-q h2{font-size:20px}
.badge{background:var(--surface-2);color:var(--muted)}
.choose.three{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.pick{position:relative}
.pick.is-current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,var(--shadow)}
.current{position:absolute;top:14px;left:14px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.choose-note{text-align:center;color:var(--muted);font-size:13.5px;margin-top:18px}
/* Admin tabs */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
</style>
<script src="config.js"></script>
</head>
<body>


<header class="topbar">
  <div class="topbar-in">
    <button class="brand" id="homeBtn" type="button"><span class="brand-mark" aria-hidden="true">SC</span>Computer &amp; Tablet Order</button>
    <nav class="crumbs" id="crumbs" aria-label="Steps"></nav>
  </div>
</header>
<main id="app"></main>
<div class="bar" id="bar" hidden></div>

<script>
(function(){
const ALLOWANCE = 50000;
const TABLET_ALLOWANCE = 40000;

/* Catalog: prices are the VAT-inclusive amounts on each vendor quotation. */
const APPLECARE_NOTE = "Extends cover to 3 years and adds unlimited accidental-damage repairs (service fee ฿3,300 for screen or enclosure damage, ฿10,000 for other damage).";
const MAC_COLORS = [
  {id:"sky", file:"skyblue", name:"Sky Blue", hex:"#c5d6e3"},
  {id:"silver", file:"silver", name:"Silver", hex:"#e2e4e6"},
  {id:"starlight", file:"starlight", name:"Starlight", hex:"#e9dfcf"},
  {id:"midnight", file:"midnight", name:"Midnight", hex:"#2f3845"}
];
const CATALOG = [
  { id:"mba13-m5-8g-16-512", cat:"mac", name:"MacBook Air 13″", tag:"Everyday",
    chip:"M5 · 10-core CPU · 8-core GPU",

    base:43900, applecare:6848, vendor:"COM7 Public Co., Ltd.", quote:"01QTS/26091123", quoteDate:"2026-09-21", validUntil:"2026-10-21", screen:13 },
  { id:"mba13-m5-10g-24-1tb", cat:"mac", name:"MacBook Air 13″", tag:"More memory",
    chip:"M5 · 10-core CPU · 10-core GPU",
    hl:[["24GB","memory"],["1TB","SSD"],["Thai","keyboard"]],
    specs:["M5 chip: 10-core CPU, 10-core GPU, 16-core Neural Engine","24GB unified memory","1TB SSD storage","13.6-inch Liquid Retina display","Backlit Magic Keyboard with Touch ID (Thai)","2× Thunderbolt 4, MagSafe 3, Wi-Fi 7, Bluetooth 6","1-year warranty"],
    base:60700, applecare:6848, vendor:"COM7 Public Co., Ltd.", quote:"01QTS/26091119", quoteDate:"2026-09-21", validUntil:"2026-10-21", screen:13 },
  { id:"mba13-m5-10g-16-2tb-us", cat:"mac", name:"MacBook Air 13″", tag:"More storage",
    chip:"M5 · 10-core CPU · 10-core GPU",
    hl:[["16GB","memory"],["2TB","SSD"],["US","keyboard"]],
    specs:["M5 chip: 10-core CPU, 10-core GPU, 16-core Neural Engine","16GB unified memory","2TB SSD storage","13.6-inch Liquid Retina display","Backlit Magic Keyboard with Touch ID (U.S. English)","2× Thunderbolt 4, MagSafe 3, Wi-Fi 7, Bluetooth 6","1-year warranty"],
    base:69496.50, applecare:6848, vendor:"COM7 Public Co., Ltd.", quote:"01QTS/26091396", quoteDate:"2026-09-25", validUntil:"2026-10-25", screen:13 },
  { id:"mba13-m5-10g-32-1tb", cat:"mac", name:"MacBook Air 13″", tag:"Most memory", tbc:true, sortKey:69400,
    chip:"M5 · 10-core CPU · 10-core GPU",

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const baht = n => "฿" + Number(n).toLocaleString("en-US",{minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits:2});
const baht2 = n => "฿" + Number(n).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
const round2 = n => Math.round(n*100)/100;
const fmtDate = iso => new Date(iso + (iso.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const expired = it => !!it.validUntil && new Date(it.validUntil + "T23:59:59") < new Date();
const byId = id => CATALOG.find(i => i.id === id);
const famById = id => TABLETS.find(t => t.id === id);
const gb = n => n >= 1024 ? (n/1024) + "TB" : n + "GB";
function topUpOf(total, limit){ return Math.max(0, round2(total - (limit || ALLOWANCE))); }
function acExtra(it){ return it.applecare ? round2(topUpOf(it.base + it.applecare) - topUpOf(it.base)) : 0; }
function totalOf(it, applecare){ return round2(it.base + (it.applecare && applecare ? it.applecare : 0)); }
function costBlock(total, note){
  const t = topUpOf(total);
  return t === 0
    ? '<div class="cost ok"><b>Within budget</b><small>No extra cost to you' + (note ? " · " + note : "") + '</small></div>'
    : '<div class="cost warn"><b class="num">+' + baht(t) + '</b><small>Added cost (top-up)' + (note ? " · " + note : "") + '</small></div>';
}
function tbcBlock(){ return '<div class="cost warn"><b>Top-up · price TBC</b><small>Above the allowance · quotation pending</small></div>'; }
function quoteLine(it){
  if (it.tbc) return '<p class="quote-meta">Quotation pending · price to be confirmed</p>';
  return expired(it)
    ? '<p class="quote-meta expired">Quote ' + esc(it.quote) + ' expired ' + fmtDate(it.validUntil) + '. Price to be re-confirmed.</p>'
    : '<p class="quote-meta">Quote ' + esc(it.quote) + ' · valid until ' + fmtDate(it.validUntil) + '</p>';
}
function tPrice(fam, size, conn, storage, nano){
  if (nano && fam.nano && fam.nano[conn][size][storage]) return fam.nano[conn][size][storage];
  return fam.price[conn][size][fam.storage.indexOf(storage)];
}
function tMin(fam){ return Math.min(...fam.sizes.map(s => fam.price.wifi[s][0])); }
function quotedFam(){ const f = famById(state.t.fam); return !!(f && f.quote); }
function estChip(price){
  const t = topUpOf(price, TABLET_ALLOWANCE);
  return t === 0 ? '<span class="est ok">Within budget</span>' : '<span class="est warn">' + (quotedFam() ? "Top-up needed" : "May need top-up") + '</span>';
}

function contactData(){ return { fullName: val("fullName"), email: val("email"), notes: val("notes") }; }
async function save(path, doc, label, onDone){
  if (!ENDPOINT){ dbNotice(); showErr("This " + label + " was not saved."); return; }
  showErr("");
  const btn = $("#submitBtn"); if (btn){ btn.disabled = true; btn.textContent = "Saving…"; }
  const payload = Object.assign({}, doc, path === "orders"
    ? { kind: "computer" }
    : { kind: "tablet", connectivity: doc.connCode, storageGB: doc.storageGB });
  try {
    // text/plain keeps this a "simple" request, which Apps Script accepts from any site.
    const res = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || "The order was not accepted.");
    Object.assign(doc, { updatedAt: out.updatedAt, submittedAt: out.submittedAt });
    if (path === "orders"){ doc.total = out.total; doc.topUp = out.topUp; state.savedTablet = null; }
    else { doc.estTopUp = out.estTopUp; state.saved = null; }
    try { localStorage.setItem(MY_KEY, JSON.stringify({ kind: path, doc })); } catch(e){}
    onDone(doc);
  } catch(e){
    showErr(e && e.message && !/fetch|network|json/i.test(e.message)
      ? e.message
      : "The " + label + " could not be saved. Check your internet connection and try again.");
    renderBar();
  }
}
function submitOrder(){
  const {it, total, topUp, tbc, needs} = currentTotals();
  const problems = validate(needs);
  if (problems.length) return showErr("Please fill in " + problems.join(", ") + ".");
  const now = new Date().toISOString();
  const color = it.cat === "mac" ? (MAC_COLORS.find(c=>c.id===state.color) || {}).name : "";
  save("orders", Object.assign({
    itemId: it.id, itemName: it.name + (it.model ? " " + it.model : "") + " (" + it.chip + ", " + it.hl.slice(0,2).map(h=>h[0]).join("/") + ")",
    category: it.cat, applecare: !!(it.applecare && state.applecare), color: color || "",
    total, topUp, tbc, withinBudget: !needs, allowance: ALLOWANCE,
    budgetSource: needs ? val("budgetSource") : "", grantCode: needs ? val("grantCode") : "",
    vendor: it.vendor, quoteRef: it.quote,
    submittedAt: state.saved && state.saved.submittedAt ? state.saved.submittedAt : now, updatedAt: now
  }, contactData()), "order", doc => { state.saved = doc; state.lastOrder = doc; go("done", {doneKind:"computer"}); });
}
function submitTablet(){
  const {fam, t, price, topUp} = tCurrent();
  const problems = validate(topUp > 0);

    family: fam.id, itemName: tabletName(), chip: fam.chip, size: t.size, connectivity: t.conn === "cell" ? (fam.cellLabel || "Wi-Fi + Cellular") : "Wi-Fi",
    storage: gb(t.storage), nanoTexture: !!t.nano, color: (fam.colors.find(c => c.id === t.color) || {}).name || "",
    estPrice: price, estTopUp: topUp, estWithinBudget: topUp === 0, allowance: TABLET_ALLOWANCE, priceSource: fam.source || TABLET_SOURCE,
    connCode: t.conn, storageGB: t.storage, status: fam.quote ? "quoted" : "awaiting quotation", quoteRef: fam.quote || "", accessories: val("accessories"),
    budgetSource: topUp > 0 ? val("budgetSource") : "", grantCode: topUp > 0 ? val("grantCode") : "",
    submittedAt: state.savedTablet && state.savedTablet.submittedAt ? state.savedTablet.submittedAt : now, updatedAt: now
  }, contactData()), "request", doc => { state.savedTablet = doc; go("done", {doneKind:"tablet"}); });
}

}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-cat],[data-item],[data-go],[data-view-saved],[data-change],[data-fam],[data-admin-tab]");
  if (!t) return;
  if (t.dataset.cat) go("lineup", {cat:t.dataset.cat});
  else if (t.dataset.item){
    const it = byId(t.dataset.item);
    const keep = state.saved && state.saved.itemId === it.id;
    go("configure", {itemId:it.id, applecare: keep ? !!state.saved.applecare : false,
      color: keep ? ((MAC_COLORS.find(c=>c.name===state.saved.color)||{}).id || "silver") : state.color});
  }
  else if (t.dataset.fam) openTablet(t.dataset.fam);
  else if (t.dataset.adminTab) go("admin", {adminTab: t.dataset.adminTab});
  else if (t.dataset.go) go(t.dataset.go, t.dataset.go === "choose" ? {cat:null} : null);
  else if (t.dataset.viewSaved) go("done", {doneKind: t.dataset.viewSaved, lastOrder: state.saved});
  else if (t.dataset.change === "tablet") state.savedTablet && state.savedTablet.family ? openTablet(state.savedTablet.family) : go("tablets");
  else if (t.dataset.change) go("lineup", {cat: (state.lastOrder || state.saved || {}).category || "mac"});
});
$("#homeBtn").addEventListener("click", () => go("choose", {cat:null, itemId:null}));

/* ---------- start ---------- */
try {
  const mine = JSON.parse(localStorage.getItem(MY_KEY) || "null");
  if (mine && mine.doc){ if (mine.kind === "orders") state.saved = mine.doc; else state.savedTablet = mine.doc; }
} catch(e){}
render();
})();
</script>
